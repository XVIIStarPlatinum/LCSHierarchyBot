name: Python Setup
description: Common Python environment setup for CI

runs:
  using: composite

  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"
        cache: pip

    - name: Install dependencies
      shell: bash
      run: |
        chmod +x ./scripts/install-ci.sh
        ./scripts/install-ci.sh
