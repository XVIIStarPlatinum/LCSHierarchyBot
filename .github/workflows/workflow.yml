name: LCS hierarchy bot pipeline
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-format:
    name: Lint & format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: ./.github/actions/python-setup

      - name: Lint (ruff check)
        run: ruff check .

      - name: Formatting (ruff format)
        run: ruff format --check .

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      BOT_USERNAME: ${{ secrets.BOT_USERNAME }}
      DATABASE_PATH: ${{ secrets.DATABASE_PATH }}
      CHAT_ID: ${{ secrets.CHAT_ID }}
      TOPIC_ID: ${{ secrets.TOPIC_ID }}
      TOPIC_IMPORTANT_ID: ${{ secrets.TOPIC_IMPORTANT_ID }}
      OWNER_ID: ${{ secrets.OWNER_ID }}
      OWNER_USERNAME: ${{ secrets.OWNER_USERNAME }}
    steps:
      - uses: ./.github/actions/python-setup

      - name: Run unit tests
        run: >
          pytest tests/unit -q
          --junitxml=test-results/unit.xml
          --cov=. --cov-report=xml:coverage-unit.xml

      - name: Upload pytest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-artifacts-unit
          path: test-results/

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: coverage-unit.xml

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      BOT_USERNAME: ${{ secrets.BOT_USERNAME }}
      DATABASE_PATH: ${{ secrets.DATABASE_PATH }}
      CHAT_ID: ${{ secrets.CHAT_ID }}
      TOPIC_ID: ${{ secrets.TOPIC_ID }}
      TOPIC_IMPORTANT_ID: ${{ secrets.TOPIC_IMPORTANT_ID }}
      OWNER_ID: ${{ secrets.OWNER_ID }}
      OWNER_USERNAME: ${{ secrets.OWNER_USERNAME }}
    steps:
      - uses: ./.github/actions/python-setup

      - name: Run integration tests
        run: >
          pytest tests/integration -q
          --junitxml=test-results/integration.xml
          --cov=. --cov-report=xml:coverage-integration.xml

      - name: Upload pytest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-artifacts-integration
          path: test-results/

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-integration
          path: coverage-integration.xml