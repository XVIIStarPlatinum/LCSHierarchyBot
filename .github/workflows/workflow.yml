name: LCS Hierarchy Bot Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-format:
    name: Lint & Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: ./.github/actions/python-setup

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      BOT_USERNAME: ${{ secrets.BOT_USERNAME }}
      DATABASE_PATH: ${{ secrets.DATABASE_PATH }}
      CHAT_ID: ${{ secrets.CHAT_ID }}
      TOPIC_ID: ${{ secrets.TOPIC_ID }}
      TOPIC_IMPORTANT_ID: ${{ secrets.TOPIC_IMPORTANT_ID }}
      OWNER_ID: ${{ secrets.OWNER_ID }}
      OWNER_USERNAME: ${{ secrets.OWNER_USERNAME }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: ./.github/actions/python-setup

      - name: Create required directories
        run: mkdir -p logs database test-results

      - name: Run unit tests
        run: |
          pytest tests/unit \
            -q \
            --junitxml=test-results/unit.xml \
            --html=test-results/unit.html \
            --self-contained-html \
            --cov=. \
            --cov-report=xml:coverage-unit.xml \
            --cov-report=html:test-results/coverage-unit

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: |
            test-results/
            coverage-unit.xml

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest

    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      BOT_USERNAME: ${{ secrets.BOT_USERNAME }}
      DATABASE_PATH: ${{ secrets.DATABASE_PATH }}
      CHAT_ID: ${{ secrets.CHAT_ID }}
      TOPIC_ID: ${{ secrets.TOPIC_ID }}
      TOPIC_IMPORTANT_ID: ${{ secrets.TOPIC_IMPORTANT_ID }}
      OWNER_ID: ${{ secrets.OWNER_ID }}
      OWNER_USERNAME: ${{ secrets.OWNER_USERNAME }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: ./.github/actions/python-setup

      - name: Create required directories
        run: mkdir -p logs database test-results

      - name: Run integration tests
        run: |
          pytest tests/integration \
            -q \
            --junitxml=test-results/integration.xml \
            --html=test-results/integration.html \
            --self-contained-html \
            --cov=. \
            --cov-report=xml:coverage-integration.xml \
            --cov-report=html:test-results/coverage-integration

      - name: Upload integration test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-report
          path: |
            test-results/
            coverage-integration.xml
