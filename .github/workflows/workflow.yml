name: workflow.yml

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint-and-test:
    name: Lint & Format-check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.x"]
    env:
      BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      BOT_USERNAME: ${{ secrets.BOT_USERNAME }}
      DATABASE_PATH: ${{ secrets.DATABASE_PATH }}
      CHAT_ID: ${{ secrets.CHAT_ID }}
      TOPIC_ID: ${{ secrets.TOPIC_ID }}
      TOPIC_IMPORTANT_ID: ${{ secrets.TOPIC_IMPORTANT_ID }}
      OWNER_ID: ${{ secrets.OWNER_ID }}
      OWNER_USERNAME: ${{ secrets.OWNER_USERNAME }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements.txt') }}
          restore-keys:
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          if [ -f requirements-test.txt ]; then
            pip install -r requirements-test.txt
          else
            pip install pytest pytest-asyncio pytest-mock pytest-cov coverage isort flake8 black mypy types-requests
          fi

      - name: Linting (flake8)
        run: |
          flake8 .

      - name: Formatting (import sorting)
        run: |
          isort --check-only .

      - name: Formatting (black)
        run: |
          black --check .

      - name: Create necessary directories
        run: |
          mkdir -p logs
          mkdir -p database

      - name: Run unit tests
        run: |
          pytest tests/unit -q --maxfail=1

      - name: Run integration tests
        run: |
          pytest tests/integration -q --maxfail=1

      - name: Upload pytest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-artifacts-${{ matrix.python-version }}
          path: ./
