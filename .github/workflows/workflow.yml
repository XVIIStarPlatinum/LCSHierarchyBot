name: LCS hierarchy bot pipeline
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-format:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: ./scripts/install-ci.sh

      - name: Linting (flake8)
        run: flake8 .

      - name: Formatting (import sorting)
        run: isort --check-only .

      - name: Formatting (black)
        run: black --check .

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    env:
      BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      BOT_USERNAME: ${{ secrets.BOT_USERNAME }}
      DATABASE_PATH: ${{ secrets.DATABASE_PATH }}
      CHAT_ID: ${{ secrets.CHAT_ID }}
      TOPIC_ID: ${{ secrets.TOPIC_ID }}
      TOPIC_IMPORTANT_ID: ${{ secrets.TOPIC_IMPORTANT_ID }}
      OWNER_ID: ${{ secrets.OWNER_ID }}
      OWNER_USERNAME: ${{ secrets.OWNER_USERNAME }}
    steps:
      - uses: ./.github/actions/python-setup

      - name: Create necessary directories
        run: mkdir -p logs database

      - name: Run unit tests
        run: pytest tests/unit -q --maxfail=1

      - name: Upload pytest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-artifacts-unit
          path: test-results/

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    env:
      BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      BOT_USERNAME: ${{ secrets.BOT_USERNAME }}
      DATABASE_PATH: ${{ secrets.DATABASE_PATH }}
      CHAT_ID: ${{ secrets.CHAT_ID }}
      TOPIC_ID: ${{ secrets.TOPIC_ID }}
      TOPIC_IMPORTANT_ID: ${{ secrets.TOPIC_IMPORTANT_ID }}
      OWNER_ID: ${{ secrets.OWNER_ID }}
      OWNER_USERNAME: ${{ secrets.OWNER_USERNAME }}
    steps:
      - uses: ./.github/actions/python-setup

      - name: Create necessary directories
        run: mkdir -p logs database

      - name: Run integration tests
        run: pytest tests/integration -q --maxfail=1

      - name: Upload pytest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-artifacts-integration
          path: test-results/
